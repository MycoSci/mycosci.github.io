version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mycosci_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mycosci_network

  wordpress:
    image: wordpress:latest
    container_name: mycosci_wordpress
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins/custom
    networks:
      - mycosci_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mycosci_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - mycosci_network

volumes:
  db_data:
  wp_data:

networks:
  mycosci_network:
    driver: bridge
